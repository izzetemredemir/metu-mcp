<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="metu-mcp: ask your AI assistant about campus life at METU">
  <!-- metu-mcp banner: the project's own mortarboard mark (not the METU logo). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5E0B1A"/>
      <stop offset="0.55" stop-color="#8E1328"/>
      <stop offset="1" stop-color="#B51A33"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="28" fill="url(#dots)"/>
  <rect width="1280" height="400" rx="28" fill="url(#glow)"/>

  <!-- mark -->
  <g transform="translate(86 92)">
    <rect width="216" height="216" rx="48" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>
    <g transform="translate(8 6) scale(0.78)">
      <path d="M74 132v38c0 24 108 24 108 0v-38l-54 26z" fill="#F4D9DE"/>
      <path d="M128 62 228 110 128 158 28 110z" fill="#FFFFFF"/>
      <path d="M128 110 196 128v44" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="196" cy="182" r="11" fill="#FFFFFF"/>
    </g>
  </g>

  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#FFFFFF">
    <text x="350" y="178" font-size="92" font-weight="800" letter-spacing="-2">metu-mcp</text>
    <text x="352" y="232" font-size="30" font-weight="500" fill-opacity="0.92">Ask your AI assistant about campus life at METU.</text>
    <text x="352" y="276" font-size="21" font-weight="400" fill-opacity="0.75">Announcements · calendar · menus · courses · ring buses — Türkçe &amp; English</text>
  </g>

  <!-- unofficial pill -->
  <g transform="translate(352 304)">
    <rect width="318" height="38" rx="19" fill="#000000" fill-opacity="0.22" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <text x="159" y="25" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="1.5" fill="#FFFFFF">UNOFFICIAL STUDENT PROJECT</text>
  </g>
</svg>
