# Official METU link catalog — the fallback layer.
#
# When the server cannot answer from its own data (login required or not collected),
# it points the student to the right official page from this list and says what they will find there.
#
# Fields:
#   id            unique kebab-case id
#   title         {en, tr}
#   url           official https URL (only *.metu.edu.tr or government sites)
#   category      calendar | registration | fees | regulations | systems | amnesty | graduate-school |
#                 department | courses | dining | parking | transport | dormitory | health | sports |
#                 library | it | international | campus | contact
#   audience      any of: all, undergraduate, graduate, <department code>
#   requires_auth false, or the system name the student must log into (oibs | student | odtuclass | metumail | tasitpulu | rez)
#   served_by     MCP tool that also answers this from live data (optional)
#   seasonal      true when the page only exists during an application window (never hidden by the link checker)
#   keywords      extra search words (Turkish and English)
#   note          {en, tr} what the student will find / do there
#   last_verified YYYY-MM-DD (updated by `metu-mcp check-links`, stored in the DB; this is the manual date)

